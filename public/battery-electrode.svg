<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="50%" stop-color="#e8921a"/>
      <stop offset="100%" stop-color="#c97a10"/>
    </linearGradient>
    <linearGradient id="electrodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a6b"/>
      <stop offset="50%" stop-color="#2d3a57"/>
      <stop offset="100%" stop-color="#1e2a42"/>
    </linearGradient>
    <linearGradient id="insulationGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="0" y1="80" x2="800" y2="80" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="480" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="480" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="480" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="480" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="480" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="480" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="480" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="400" y="44" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">BATTERY ELECTRODE CROSS-SECTION</text>
  <text x="400" y="64" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="3">INSULATION FILM THICKNESS ANALYSIS</text>

  <!-- === LAYER STACK (centered, cross-section view) === -->

  <!-- Copper foil (current collector) -->
  <rect x="120" y="100" width="560" height="52" rx="2" fill="url(#copperGrad)" opacity="0.95"/>
  <rect x="120" y="100" width="560" height="52" rx="2" fill="none" stroke="#f5a62355" stroke-width="1"/>
  <!-- copper texture lines -->
  <g opacity="0.15">
    <line x1="120" y1="110" x2="680" y2="110" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="120" x2="680" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="130" x2="680" y2="130" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="140" x2="680" y2="140" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Electrode layer (anode material) -->
  <rect x="120" y="155" width="560" height="90" rx="2" fill="url(#electrodeGrad)" opacity="0.95"/>
  <rect x="120" y="155" width="560" height="90" rx="2" fill="none" stroke="#4a5a8033" stroke-width="1"/>
  <!-- particle texture dots -->
  <g fill="#5a6a9033" opacity="0.5">
    <circle cx="160" cy="180" r="6"/><circle cx="200" cy="195" r="8"/><circle cx="245" cy="175" r="5"/>
    <circle cx="290" cy="190" r="7"/><circle cx="330" cy="178" r="6"/><circle cx="375" cy="196" r="9"/>
    <circle cx="420" cy="173" r="5"/><circle cx="460" cy="188" r="7"/><circle cx="505" cy="177" r="8"/>
    <circle cx="548" cy="194" r="6"/><circle cx="590" cy="180" r="5"/><circle cx="635" cy="190" r="7"/>
    <circle cx="180" cy="215" r="7"/><circle cx="225" cy="228" r="5"/><circle cx="270" cy="212" r="8"/>
    <circle cx="315" cy="224" r="6"/><circle cx="358" cy="215" r="9"/><circle cx="400" cy="228" r="5"/>
    <circle cx="445" cy="213" r="7"/><circle cx="490" cy="224" r="6"/><circle cx="535" cy="216" r="8"/>
    <circle cx="578" cy="229" r="5"/><circle cx="618" cy="218" r="7"/><circle cx="655" cy="225" r="6"/>
  </g>

  <!-- Insulation layer (절연막) - highlighted purple with glow -->
  <rect x="120" y="248" width="560" height="22" rx="1" fill="url(#insulationGrad)" filter="url(#softGlow)" opacity="0.95"/>
  <rect x="120" y="248" width="560" height="22" rx="1" fill="none" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- Thickness measurement arrows on insulation layer -->
  <g filter="url(#glow)">
    <line x1="75" y1="248" x2="75" y2="270" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="70" y1="248" x2="80" y2="248" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="70" y1="270" x2="80" y2="270" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="68" y="262" font-family="monospace" font-size="10" fill="#a78bfa" text-anchor="middle">t</text>
  </g>

  <!-- Second electrode layer -->
  <rect x="120" y="273" width="560" height="90" rx="2" fill="url(#electrodeGrad)" opacity="0.9"/>
  <rect x="120" y="273" width="560" height="90" rx="2" fill="none" stroke="#4a5a8033" stroke-width="1"/>
  <g fill="#5a6a9033" opacity="0.5">
    <circle cx="155" cy="295" r="7"/><circle cx="198" cy="308" r="5"/><circle cx="242" cy="292" r="8"/>
    <circle cx="285" cy="305" r="6"/><circle cx="328" cy="295" r="9"/><circle cx="372" cy="308" r="5"/>
    <circle cx="415" cy="293" r="7"/><circle cx="458" cy="306" r="8"/><circle cx="500" cy="295" r="6"/>
    <circle cx="542" cy="309" r="5"/><circle cx="584" cy="296" r="7"/><circle cx="626" cy="305" r="8"/>
    <circle cx="170" cy="332" r="6"/><circle cx="215" cy="345" r="8"/><circle cx="260" cy="330" r="5"/>
    <circle cx="305" cy="342" r="7"/><circle cx="348" cy="333" r="6"/><circle cx="392" cy="344" r="9"/>
    <circle cx="436" cy="331" r="5"/><circle cx="480" cy="343" r="7"/><circle cx="524" cy="334" r="8"/>
    <circle cx="566" cy="345" r="6"/><circle cx="608" cy="335" r="7"/><circle cx="650" cy="344" r="5"/>
  </g>

  <!-- Bottom copper foil -->
  <rect x="120" y="366" width="560" height="52" rx="2" fill="url(#copperGrad)" opacity="0.9"/>
  <rect x="120" y="366" width="560" height="52" rx="2" fill="none" stroke="#f5a62333" stroke-width="1"/>
  <g opacity="0.15">
    <line x1="120" y1="376" x2="680" y2="376" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="386" x2="680" y2="386" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="396" x2="680" y2="396" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="406" x2="680" y2="406" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- === LABELS (right side) === -->
  <line x1="684" y1="126" x2="710" y2="126" stroke="#f5a62388" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="714" y="122" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="11" fill="#f5a623" font-weight="500">Cu Current Collector</text>
  <text x="714" y="136" font-family="monospace" font-size="9" fill="#f5a62399">집전체 (동박)</text>

  <line x1="684" y1="200" x2="710" y2="200" stroke="#4a6fa588" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="714" y="196" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="11" fill="#7ba3d4" font-weight="500">Electrode Layer</text>
  <text x="714" y="210" font-family="monospace" font-size="9" fill="#7ba3d499">활물질층 (음극재)</text>

  <line x1="684" y1="259" x2="710" y2="259" stroke="#a78bfa88" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="714" y="255" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="11" fill="#a78bfa" font-weight="600">Insulation Film</text>
  <text x="714" y="269" font-family="monospace" font-size="9" fill="#a78bfa99">절연막 (측정 대상)</text>

  <line x1="684" y1="318" x2="710" y2="318" stroke="#4a6fa588" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="714" y="314" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="11" fill="#7ba3d4" font-weight="500">Electrode Layer</text>
  <text x="714" y="328" font-family="monospace" font-size="9" fill="#7ba3d499">활물질층</text>

  <line x1="684" y1="392" x2="710" y2="392" stroke="#f5a62388" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="714" y="388" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="11" fill="#f5a623" font-weight="500">Cu Current Collector</text>
  <text x="714" y="402" font-family="monospace" font-size="9" fill="#f5a62399">집전체 (동박)</text>

  <!-- === DATA indicator (bottom left) === -->
  <rect x="120" y="432" width="220" height="32" rx="6" fill="#a78bfa11" stroke="#a78bfa33" stroke-width="1"/>
  <circle cx="140" cy="448" r="5" fill="#a78bfa" filter="url(#glow)"/>
  <text x="152" y="452" font-family="monospace" font-size="10" fill="#a78bfa">절연막 두께 실시간 모니터링</text>

  <!-- Thickness value chip -->
  <rect x="358" y="432" width="150" height="32" rx="6" fill="#22c55e11" stroke="#22c55e33" stroke-width="1"/>
  <text x="433" y="444" font-family="monospace" font-size="9" fill="#22c55e" text-anchor="middle">THICKNESS</text>
  <text x="433" y="458" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">0.XXX μm</text>
</svg>
