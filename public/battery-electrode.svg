<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="18%" stop-color="#555"/>
      <stop offset="35%" stop-color="#888"/>
      <stop offset="50%" stop-color="#aaa"/>
      <stop offset="65%" stop-color="#888"/>
      <stop offset="82%" stop-color="#555"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="topCapGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="20%" stop-color="#444"/>
      <stop offset="50%" stop-color="#666"/>
      <stop offset="80%" stop-color="#444"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="posTermGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="50%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a1a"/>
      <stop offset="15%" stop-color="#2d5a2d"/>
      <stop offset="50%" stop-color="#3a7a3a"/>
      <stop offset="85%" stop-color="#2d5a2d"/>
      <stop offset="100%" stop-color="#1a3a1a"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#1a1a22"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- Battery group, centered -->
  <g transform="translate(200, 150)" filter="url(#shadow)">

    <!-- Battery body -->
    <rect x="-130" y="-60" width="260" height="120" rx="12" fill="url(#bodyGrad)"/>

    <!-- Green label band -->
    <rect x="-100" y="-60" width="200" height="120" fill="url(#labelGrad)"/>

    <!-- Label text: AA -->
    <text x="0" y="-18" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.95">AA</text>
    <!-- Label text: 1.5V -->
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a8e6a8" text-anchor="middle" letter-spacing="2">1.5V</text>
    <!-- Label text: ALKALINE -->
    <text x="0" y="36" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#88cc88" text-anchor="middle" letter-spacing="3">ALKALINE</text>

    <!-- Negative terminal (flat, left) -->
    <rect x="-142" y="-18" width="14" height="36" rx="3" fill="url(#topCapGrad)"/>
    <rect x="-144" y="-12" width="4" height="24" rx="2" fill="#222"/>

    <!-- Positive terminal (nub, right) -->
    <rect x="128" y="-20" width="16" height="40" rx="4" fill="url(#topCapGrad)"/>
    <rect x="142" y="-12" width="12" height="24" rx="6" fill="url(#posTermGrad)"/>

    <!-- Shine highlight -->
    <rect x="-100" y="-55" width="200" height="18" rx="4" fill="white" opacity="0.07"/>
    <rect x="-128" y="-55" width="26" height="18" rx="4" fill="white" opacity="0.06"/>

    <!-- Minus symbol -->
    <rect x="-136" y="-3" width="8" height="6" rx="1" fill="#666"/>
    <!-- Plus symbol -->
    <rect x="149" y="-3" width="8" height="6" rx="1" fill="#999"/>
    <rect x="152" y="-6" width="2" height="12" rx="1" fill="#999"/>

  </g>
</svg>
